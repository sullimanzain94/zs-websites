<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLM CRM Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  background: #0f1115;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-md">
  <div class="bg-[#181b21] border border-white/10 rounded-2xl p-8 shadow-2xl">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold">Prime Lane Motors</h1>
      <p class="text-gray-400 mt-2">Internal Sales CRM</p>
    </div>

    <form id="login-form" class="space-y-5">

      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Email
        </label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          class="w-full px-4 py-3 rounded-lg bg-[#0f1115] border border-white/10 text-white outline-none focus:border-yellow-400"
          placeholder="Enter email address"
        >
      </div>

      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Password
        </label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          class="w-full px-4 py-3 rounded-lg bg-[#0f1115] border border-white/10 text-white outline-none focus:border-yellow-400"
          placeholder="Enter password"
        >
      </div>

      <div id="error-message" class="hidden text-red-400 text-sm"></div>

      <button
        type="submit"
        id="login-button"
        class="w-full py-3 rounded-lg bg-yellow-400 text-black font-bold hover:bg-yellow-300 transition"
      >
        Sign In
      </button>

    </form>

  </div>
</div>

<script>
const API_BASE =
  `${window.location.protocol}//${window.location.hostname}:3000`;

const form = document.getElementById('login-form');
const button = document.getElementById('login-button');
const errorMessage = document.getElementById('error-message');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  errorMessage.classList.add('hidden');
  button.disabled = true;
  button.textContent = 'Signing in...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const response = await fetch(`${API_BASE}/api/auth/login`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || 'Login failed');
    }

    if (!result.data || !result.data.tokens || !result.data.tokens.accessToken) {
      throw new Error('Login succeeded but no access token was returned');
    }

    localStorage.setItem(
      'plm_access_token',
      result.data.tokens.accessToken
    );

    window.location.href = 'code.html';

  } catch (error) {
    console.error('PLM CRM login error:', error);

    errorMessage.textContent = error.message;
    errorMessage.classList.remove('hidden');

    button.disabled = false;
    button.textContent = 'Sign In';
  }
});
</script>

</body>
</html>
